```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #94a3b8; font-family: monospace; }
        pre { white-space: pre-wrap; word-break: break-all; }
        .term-scroll::-webkit-scrollbar { width: 4px; }
        .term-scroll::-webkit-scrollbar-thumb { background: #1e293b; }
    </style>
</head>
<body class="p-4 h-screen flex flex-col items-center">
    <div class="w-full max-w-4xl flex flex-col h-full bg-slate-900/50 rounded-xl border border-slate-800 overflow-hidden">
        <div class="bg-slate-900 px-4 py-2 border-b border-slate-800 flex items-center justify-between">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">OpenCode Terminal Bridge</span>
            <div id="status" class="w-2 h-2 rounded-full bg-green-500"></div>
        </div>
        
        <div id="terminal" class="flex-1 p-6 overflow-y-auto term-scroll text-sm space-y-2">
            <div class="text-blue-500 italic font-bold">CONECTADO AO SISTEMA BRIDGE</div>
            <div class="text-slate-600">Digite 'opencode logs' para monitorar o BTR.</div>
        </div>

        <div class="p-4 bg-black/20 border-t border-slate-800 flex items-center gap-3">
            <span class="text-blue-500 font-bold">$</span>
            <input type="text" id="input" autofocus class="bg-transparent border-none outline-none flex-1 text-blue-100" placeholder="Comando...">
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('input');

        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const cmd = input.value;
                input.value = '';
                addLog(`$ ${cmd}`, 'text-white font-bold');
                
                try {
                    // USO DE CAMINHO RELATIVO PARA EVITAR ERROS 502/CORS
                    const res = await fetch('/run', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ command: cmd })
                    });
                    const data = await res.json();
                    if(data.output) addLog(data.output, 'text-slate-300');
                    if(data.error) addLog(data.error, 'text-red-400');
                } catch (err) {
                    addLog('Erro ao comunicar com o servidor.', 'text-red-500');
                }
            }
        });

        function addLog(text, color) {
            const el = document.createElement('pre');
            el.className = `mt-1 ${color}`;
            el.textContent = text;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
