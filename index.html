```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode | Console Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; }
        .terminal-font { font-family: 'Fira Code', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="w-full max-w-4xl space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900/40 p-6 rounded-2xl border border-slate-800 backdrop-blur-sm gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-3 rounded-xl">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">OpenCode Bridge</h1>
                    <div id="status-badge" class="inline-flex items-center gap-1.5 text-[10px] uppercase font-bold text-slate-500">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
                        Aguardando...
                    </div>
                </div>
            </div>
            <div class="text-right hidden md:block">
                <div class="text-[10px] text-slate-500 uppercase font-bold">Endpoint Atual</div>
                <div class="text-blue-400 text-xs font-mono">opencode-production-9377.up.railway.app</div>
            </div>
        </header>

        <!-- Main Terminal -->
        <main class="bg-black rounded-2xl border border-slate-800 shadow-2xl overflow-hidden flex flex-col h-[500px]">
            <div id="terminal-output" class="flex-1 p-6 overflow-y-auto terminal-font text-sm custom-scrollbar bg-[#020617]/40 leading-relaxed">
                <div class="text-slate-600 italic">Interface conectada ao projeto 9377. Pronta para comandos.</div>
            </div>

            <div class="p-4 bg-slate-900/50 border-t border-slate-800 flex items-center gap-3">
                <span class="text-blue-500 font-bold terminal-font">$</span>
                <input type="text" id="cmdInput" autofocus autocomplete="off"
                    class="flex-1 bg-transparent border-none focus:ring-0 text-blue-100 terminal-font placeholder-slate-700"
                    placeholder="opencode logs">
                <div id="loader" class="hidden animate-spin h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full"></div>
            </div>
        </main>

        <!-- Quick Actions -->
        <div class="flex flex-wrap gap-2 justify-center">
            <button onclick="run('opencode --help')" class="px-3 py-1 text-[11px] bg-slate-800 hover:bg-slate-700 rounded border border-slate-700">--help</button>
            <button onclick="run('opencode logs')" class="px-3 py-1 text-[11px] bg-blue-900/30 text-blue-400 hover:bg-blue-900/50 rounded border border-blue-800">Logs BTR</button>
            <button onclick="run('opencode status')" class="px-3 py-1 text-[11px] bg-slate-800 hover:bg-slate-700 rounded border border-slate-700">Status</button>
        </div>
    </div>

    <script>
        const output = document.getElementById('terminal-output');
        const input = document.getElementById('cmdInput');
        const loader = document.getElementById('loader');
        const badge = document.getElementById('status-badge');

        // URL do servidor Bridge (o que você acabou de criar)
        const BRIDGE_URL = "https://opencode-production-9377.up.railway.app";

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && input.value.trim()) {
                run(input.value);
                input.value = '';
            }
        });

        async function run(command) {
            printLine(`<span class="text-blue-500 font-bold">$</span> <span class="text-white">${command}</span>`);
            loader.classList.remove('hidden');
            
            try {
                const res = await fetch(`${BRIDGE_URL}/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                
                const data = await res.json();
                if (data.output) printLine(`<pre class="text-slate-300 mt-1">${escape(data.output)}</pre>`);
                if (data.error) printLine(`<pre class="text-red-400 mt-1">${escape(data.error)}</pre>`);
                
                updateStatus('Online', 'bg-green-500');
            } catch (err) {
                printLine(`<span class="text-red-500 font-bold">[ERRO]</span> Falha na conexão com o servidor bridge.`);
                updateStatus('Offline', 'bg-red-500');
            } finally {
                loader.classList.add('hidden');
                output.scrollTop = output.scrollHeight;
            }
        }

        function printLine(html) {
            const div = document.createElement('div');
            div.className = 'mb-2 animate-in fade-in duration-300';
            div.innerHTML = html;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function updateStatus(text, colorClass) {
            badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${colorClass}"></span> ${text}`;
        }

        function escape(s) {
            return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m]));
        }
    </script>
</body>
</html>
